name: Ошибка
description: Сообщить об ошибке
title: "[bug] кратко суть"
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Как получить баг
      placeholder: 1) ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true