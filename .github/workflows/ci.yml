name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_node=true" >> $GITHUB_OUTPUT; else echo "has_node=false" >> $GITHUB_OUTPUT; fi
      - name: Setup Node
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install pnpm
        if: steps.detect.outputs.has_node == 'true'
        run: npm i -g pnpm@9
      - name: Install deps
        if: steps.detect.outputs.has_node == 'true'
        run: pnpm i --frozen-lockfile=false
      - name: Lint
        if: steps.detect.outputs.has_node == 'true'
        run: pnpm -s lint || echo 'no lint script'
      - name: Test
        if: steps.detect.outputs.has_node == 'true'
        run: pnpm -s test || echo 'no test script'
      - name: Basic repo checks
        if: steps.detect.outputs.has_node == 'false'
        run: |
          echo 'Repo without package.json — running basic checks'
          test -f README.md && echo 'README exists' || echo 'README missing'
